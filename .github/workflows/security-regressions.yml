name: Package security regressions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 8.12.0
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - run: node scripts/release-inputs.mjs
      - run: pnpm audit --audit-level=high
      - run: pnpm run test --force
      - run: pnpm run test:coverage
      - run: node scripts/consumer-runtime-smoke.mjs "$(command -v node)" "$NODE_MAJOR"
        shell: bash
        if: matrix.os == 'ubuntu-24.04'
        env:
          NODE_MAJOR: ${{ matrix.node }}
