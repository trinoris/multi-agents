name: Package security regressions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: 8.12.0
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - run: node scripts/release-inputs.mjs
      - run: pnpm audit --audit-level=high
      - run: pnpm run test --force
      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-latest' && matrix.node == 20
        with:
          node-version: 18
      - run: node scripts/consumer-runtime-smoke.mjs "$(command -v node)" 18
        shell: bash
        if: matrix.os == 'ubuntu-latest' && matrix.node == 20
